<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>候选人简历 · 软件开发</title>
<style>
:root{
  --ink:#1a2233;--sub:#5a6478;--line:#e4e8f0;--accent:#3b82f6;
  --bg:#f7f8fb;--card:#fff;
  --bar-h:48px;--input-h:54px;
}
body.dark{
  --ink:#e5e9f2;--sub:#9aa4b8;--line:#2a3245;--accent:#60a5fa;
  --bg:#0f1420;--card:#171e2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}

/* ================= mobile top bar ================= */
#topbar{
  display:none;position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:120;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  align-items:center;justify-content:space-between;padding:0 14px;
}
#topbar .name{font-weight:600;font-size:14px}
#topbar .expand{
  border:none;background:#eef2ff;color:var(--accent);border-radius:8px;
  padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600;
}

/* ================= mobile bottom input bar ================= */
#inputbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:120;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
}
#inputbar button{
  width:100%;border:none;background:var(--accent);color:#fff;border-radius:12px;
  padding:13px;font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 14px rgba(37,99,235,.25);
}

/* ================= layout ================= */
#resume-panel{width:100%}
.resume-inner{max-width:760px;margin:0 auto;padding:20px 18px 96px}
#chat-panel{display:none}

/* ---------- desktop split ---------- */
@media (min-width:900px){
  #topbar,#inputbar{display:none!important}
  .layout{display:flex;height:100vh;overflow:hidden}
  #resume-panel{width:50%;height:100vh;overflow-y:auto;border-right:1px solid var(--line)}
  .resume-inner{padding:40px 32px 60px}
  #chat-panel{
    display:block;width:50%;height:100vh;position:relative;background:#fff;
  }
  #chat-frame{width:100%;height:100%;border:none;display:block}
  #sheet-handle{display:none}
}

/* ---------- mobile: chat is a bottom sheet over the resume ---------- */
@media (max-width:899px){
  #topbar{display:flex}
  #inputbar{display:block}
  body{padding-top:var(--bar-h)}
  #chat-panel{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:110;
    height:0;overflow:hidden;background:#fff;
    border-radius:18px 18px 0 0;
    box-shadow:0 -8px 32px rgba(20,30,60,.18);
    transition:height .28s cubic-bezier(.4,0,.2,1);
  }
  #chat-panel.open{height:min(78vh,640px)}
  #chat-panel .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px 6px;border-bottom:1px solid var(--line);
  }
  #chat-panel .sheet-head .t{font-size:14px;font-weight:600}
  #chat-panel .sheet-head .close{
    border:none;background:#f1f4f9;color:var(--sub);border-radius:50%;
    width:30px;height:30px;font-size:15px;cursor:pointer;
  }
  #chat-frame{width:100%;border:none;display:block;
    height:calc(min(78vh,640px) - 52px)}
}
body.sheet-open #inputbar{display:none} /* hide entry bar while sheet open */

/* ================= resume styling ================= */
header{padding:30px 0 8px}
header h1{font-size:28px}
header .status{color:var(--sub);margin-top:4px;font-size:14.5px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{background:#eef2ff;color:var(--accent);border-radius:999px;padding:3px 13px;font-size:12.5px}
.cta{margin-top:20px;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;padding:11px 26px;border-radius:10px;font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,.22);cursor:pointer;border:none}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:18px}
h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:17px;background:var(--accent);border-radius:2px}
.item{padding:11px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none}
.item h3{font-size:15px}
.item .meta{color:var(--sub);font-size:13px;margin:2px 0 5px}
ul{padding-left:19px}
li{margin:3px 0;font-size:14px}
.ph{color:#b6bdcc}
.note{text-align:center;color:var(--sub);font-size:12px;margin-top:22px}
body.dark #topbar,body.dark #inputbar{background:rgba(15,20,32,.94)}
body.dark .tag{background:#1e2a44}
body.dark .cta,body.dark #inputbar button{box-shadow:0 4px 14px rgba(59,130,246,.3)}
body.dark #chat-panel{background:#171e2e}
@media print{.cta,#topbar,#inputbar,#chat-panel{display:none!important}section{border:none}}

/* theme toggle */
#theme-btn{
  position:fixed;right:14px;bottom:74px;z-index:130;
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;
  box-shadow:0 4px 16px rgba(20,30,60,.14);
}
@media (min-width:900px){#theme-btn{bottom:auto;top:14px;right:calc(25% + 22px)}}

</style>
</head>
<body>

<div id="topbar">
  <span class="name" id="bar-name">候选人简历</span>
  <button class="expand" onclick="openChat()">💬 打开对话</button>
</div>

<div class="layout">
  <div id="resume-panel">
    <div class="resume-inner wrap" id="resume-body">
      <header>
        <h1 id="r-name"><span class="ph">&lt;姓名&gt;</span></h1>
        <div class="status" id="r-status"><span class="ph">&lt;求职状态 · 期望职位 · 期望城市&gt;</span></div>
        <div class="tags" id="r-tags"></div>
      </header>
      <section>
        <h2>个人简介</h2>
        <p id="r-summary" style="font-size:14.5px"><span class="ph">&lt;简历上传后自动展示&gt;</span></p>
      </section>
      <section>
        <h2>工作经历</h2>
        <div id="r-experience"><div class="item"><h3 class="ph">&lt;公司 · 职位&gt;</h3><div class="meta ph">&lt;时间段&gt;</div></div></div>
      </section>
      <section>
        <h2>项目经验</h2>
        <div id="r-projects"><div class="item"><h3 class="ph">&lt;项目名称&gt;</h3><div class="meta ph">&lt;技术栈&gt;</div><ul><li class="ph">&lt;项目亮点（详情可问 Agent）&gt;</li></ul></div></div>
      </section>
      <section>
        <h2>技能</h2>
        <div id="r-skills"><div class="item ph">&lt;技能标签上传后自动生成&gt;</div></div>
      </section>
      <p class="note">本页由候选人授权展示 · 深入问题请与 Agent 对话 · © 2026</p>
    </div>
  </div>

  <div id="chat-panel">
    <div class="sheet-head">
      <span class="t">候选人 Agent</span>
      <button class="close" onclick="closeChat()">✕</button>
    </div>
    <iframe id="chat-frame" src="/chat/" title="候选人 Agent"></iframe>
  </div>
</div>

<button id="theme-btn" onclick="toggleTheme()" title="切换明暗">🌙</button>

<div id="inputbar">
  <button onclick="openChat()">💬 想深入了解候选人？点击开始对话</button>
</div>

<script>
const panel = document.getElementById('chat-panel');

/* ---------- unified theme (resume + chainlit iframe) ---------- */
const THEME_KEY = 'vite-ui-theme';
function iframeWin(){ try{return document.getElementById('chat-frame').contentWindow}catch(e){return null} }
function applyTheme(dark, syncIframe){
  document.body.classList.toggle('dark', dark);
  document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('jas-dark', dark ? '1' : '0');
  const w = iframeWin();
  if(syncIframe && w){
    try{
      w.localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
      w.location.reload();
    }catch(e){}
  }
}
function syncFromChainlit(){
  const w = iframeWin();
  if(!w) return;
  try{
    const v = w.localStorage.getItem(THEME_KEY);
    const val = v.replace(/\"/g,''); if(val==='dark'||val==='light') applyTheme(val==='dark', false);
  }catch(e){}
}
function toggleTheme(){
  applyTheme(!document.body.classList.contains('dark'), true);
}
// initial: prefer our saved choice, else chainlit's, else light
(function(){
  const mine = localStorage.getItem('jas-dark');
  if(mine !== null){ applyTheme(mine === '1', false); }
})();
// if user toggles theme inside chainlit, resume follows on next iframe load
document.getElementById('chat-frame').addEventListener('load', syncFromChainlit);

function openChat(){
  panel.classList.add('open');
  document.body.classList.add('sheet-open');
  const f = document.getElementById('chat-frame');
  if(!f.src || f.src === 'about:blank') f.src = '/chat/';
}
function closeChat(){
  panel.classList.remove('open');
  document.body.classList.remove('sheet-open');
}

async function loadResume(){
  try{
    const r = await fetch('/resume-data.json', {cache:'no-store'});
    if(!r.ok) return;
    const d = await r.json();
    const set = (id, html) => { const el=document.getElementById(id); if(el&&html) el.innerHTML=html; };
    if(d.name) set('r-name', d.name);
    if(d.status) set('r-status', d.status);
    if(d.tags) document.getElementById('r-tags').innerHTML =
      d.tags.map(t=>`<span class="tag">${t}</span>`).join('');
    if(d.summary) set('r-summary', d.summary);
    if(d.experience) set('r-experience', d.experience.map(e=>
      `<div class="item"><h3>${e.title}</h3><div class="meta">${e.meta||''}</div>${e.points?`<ul>${e.points.map(p=>`<li>${p}</li>`).join('')}</ul>`:''}</div>`
    ).join(''));
    if(d.projects) set('r-projects', d.projects.map(p=>
      `<div class="item"><h3>${p.title}</h3><div class="meta">${p.meta||''}</div>${p.points?`<ul>${p.points.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`
    ).join(''));
    if(d.skills) set('r-skills', d.skills.map(s=>`<div class="item">${s}</div>`).join(''));
    if(d.name){
      document.getElementById('bar-name').textContent = d.name + ' · 简历';
      document.title = d.name + ' · 简历';
    }
  }catch(e){}
}
loadResume();
</script>
</body>
</html>

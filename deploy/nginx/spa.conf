# SPA fallback for the frontend containers.
#
# Both React apps use client-side routing, so any path that is not a real file on
# disk must serve index.html instead of 404 — otherwise a page refresh or a
# directly shared link (e.g. /admin/login, /admin/skills) breaks. The outer
# gateway strips the /admin/ prefix before proxying here, so this config is
# identical for both apps regardless of their Vite `base`.
#
# Installed as /etc/nginx/conf.d/default.conf, replacing the stock nginx config
# (two server blocks on port 80 would otherwise compete for the default server).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets never change content for a given name. Serve a
    # real 404 rather than the HTML shell, so a stale bundle reference fails
    # loudly instead of being parsed as JavaScript. Cache headers are
    # intentionally left to the outer gateway, which already sets them — adding
    # them here too would emit duplicate Cache-Control headers.
    location /assets/ {
        try_files $uri =404;
    }

    # The HTML shell must not be cached, or a redeploy stays invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

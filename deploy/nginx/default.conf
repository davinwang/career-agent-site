upstream backend {
    server backend:4111;
}
upstream recruiter_frontend {
    server recruiter:80;
}
upstream admin_frontend {
    server admin:80;
}

server {
    listen 80;
    server_name _;

    # Resolver for Docker DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Max upload size
    client_max_body_size 50m;

    # API routes -> backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AG-UI SSE endpoints -> backend (with streaming support)
    location /ag-ui/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Uploaded files (logos, photos) are served publicly by the backend.
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health check
    location /health {
        proxy_pass http://backend/api/health;
    }

    # Admin frontend (built with base '/admin/'; strip the prefix when proxying).
    # nginx picks the longest matching prefix, so /admin/assets/ wins over /admin/.
    location /admin/ {
        proxy_pass http://admin_frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/assets/ {
        proxy_pass http://admin_frontend/assets/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, immutable";
    }

    # Recruiter frontend (default)
    location / {
        proxy_pass http://recruiter_frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /assets/ {
        proxy_pass http://recruiter_frontend/assets/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, immutable";
    }
}

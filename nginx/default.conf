map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ---- gzip: 3.7MB chainlit bundle -> ~1MB ----
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;
    gzip_vary on;

    client_max_body_size 50m;

    # ---- Resume page is the default landing page ----
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ---- resume-data.json: written by admin via shared volume, served by nginx ----
    location = /resume-data.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # ---- vendored static assets (fonts, katex css) ----
    location /vendor/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Public Chainlit chat under /chat/ ----
    location /chat/ {
        proxy_pass http://public:8000;
        proxy_set_header X-Forwarded-Prefix /chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ---- Admin Chainlit app: /admin/ ----
    location /admin/ {
        proxy_pass http://admin:8000;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # docker embedded DNS: re-resolve upstreams per request so
    # container IP changes (recreate/redeploy) never stale-cache again
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- gzip: 3.7MB chainlit bundle -> ~1MB ----
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;
    gzip_vary on;

    client_max_body_size 50m;

    # ---- Resume page is the default landing page ----
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ---- resume-data.json: written by admin via shared volume, served by nginx ----
    # ---- owner profile photo (written via MCP/avatar tooling) ----
    location = /avatar.jpg {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /resume-data.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # ---- multi-language resume data + language manifest ----
    location ~ ^/resume-data\.[a-z][a-z]\.json$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location = /resume-langs.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # ---- JWT token issuance for MCP clients (owner only) ----
    location = /token {
        set $mcp_token_upstream http://mcp:8000/token;
        proxy_pass $mcp_token_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # ---- dynamically generated resume PDF (from published page data) ----
    location = /resume-pdf {
        set $mcp_pdf_upstream http://mcp:8000/resume-pdf;
        proxy_pass $mcp_pdf_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # ---- vendored static assets (fonts, katex css) ----
    location /vendor/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- visitor thread-lookup API (scoped by jas_vuid cookie) ----
    location /chat/api/ {
        set $mcp_threadapi_upstream http://mcp:8000/thread-api/;
        proxy_pass $mcp_threadapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 30s;
    }

    # ---- Public Chainlit chat under /chat/ ----
    location /chat/ {
        set $public_upstream http://public:8000;
        proxy_pass $public_upstream;
        proxy_set_header X-Forwarded-Prefix /chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ---- Admin Chainlit app: /admin/ ----
    location /mcp {
        set $mcp_upstream http://mcp:8000;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /admin/ {
        set $admin_upstream http://admin:8000;
        proxy_pass $admin_upstream;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
